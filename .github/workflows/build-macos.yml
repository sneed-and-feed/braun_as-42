name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore: ['**.md', 'docs/**', 'wiki/**']
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal (ARM64 & x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DAS42_BUILD_TESTS=OFF

      - name: Compile Release Targets
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected version tag: ${TAG}"

      - name: Package Distribution Zip & Compute Checksum
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p package/VST3 package/AU package/Standalone
          echo "Listing generated build artefacts:"
          find build -name "*.vst3" -o -name "*.component" -o -name "*.app" || true

          for d in $(find build -type d -name "BRAUN_AS42.vst3"); do
            echo "Copying VST3 from $d"
            cp -R "$d" package/VST3/
            break
          done

          for d in $(find build -type d -name "BRAUN_AS42.component"); do
            echo "Copying AU from $d"
            cp -R "$d" package/AU/
            break
          done

          for d in $(find build -type d -name "BRAUN_AS42.app"); do
            echo "Copying Standalone from $d"
            cp -R "$d" package/Standalone/
            break
          done

          # Sanity check: Ensure required binaries were packaged
          if [ ! -d "package/VST3/BRAUN_AS42.vst3" ]; then
            echo "Error: BRAUN_AS42.vst3 was not copied into package!" >&2
            exit 1
          fi
          if [ ! -d "package/AU/BRAUN_AS42.component" ]; then
            echo "Error: BRAUN_AS42.component was not copied into package!" >&2
            exit 1
          fi
          if [ ! -d "package/Standalone/BRAUN_AS42.app" ]; then
            echo "Error: BRAUN_AS42.app was not copied into package!" >&2
            exit 1
          fi

          echo "Stripping quarantine attributes and applying ad-hoc signatures for Apple Silicon / Gatekeeper..."
          for bundle in "package/VST3/BRAUN_AS42.vst3" "package/AU/BRAUN_AS42.component" "package/Standalone/BRAUN_AS42.app"; do
            if [ -e "$bundle" ]; then
              echo "Processing $bundle..."
              xattr -cr "$bundle" 2>/dev/null || true
              codesign --force --deep --sign - "$bundle"
            fi
          done

          # Copy easy-run scripts into package root and grant execute permissions
          if [ -d "scripts/macos" ]; then
            echo "Copying macOS easy-run helper scripts..."
            cp scripts/macos/*.command package/ 2>/dev/null || true
            chmod +x package/*.command 2>/dev/null || true
          fi

          [ -f LICENSE ] && cp LICENSE package/ || true
          [ -f README.md ] && cp README.md package/ || true
          ZIP_NAME="BRAUN_AS42-${TAG}-macOS-Universal.zip"
          cd package
          zip -r "../${ZIP_NAME}" *
          cd ..
          shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          cat "${ZIP_NAME}.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRAUN_AS42-${{ steps.version.outputs.tag }}-macOS-Universal
          path: |
            BRAUN_AS42-${{ steps.version.outputs.tag }}-macOS-Universal.zip
            BRAUN_AS42-${{ steps.version.outputs.tag }}-macOS-Universal.zip.sha256

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ZIP_NAME="BRAUN_AS42-${TAG}-macOS-Universal.zip"
          SHA_NAME="${ZIP_NAME}.sha256"
          for attempt in 1 2 3; do
            echo "Attempt $attempt: uploading release asset to ${TAG}..."
            if gh release upload "${TAG}" "${ZIP_NAME}" "${SHA_NAME}" --repo ${{ github.repository }} --clobber; then
              echo "Upload succeeded!"
              exit 0
            fi
            echo "Upload attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          exit 1
