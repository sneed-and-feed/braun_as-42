name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore: ['**.md', 'docs/**', 'wiki/**']
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal (ARM64 & x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DAS42_BUILD_TESTS=OFF

      - name: Compile Release Targets
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Package Distribution Zip
        run: |
          mkdir -p package/VST3 package/AU package/Standalone
          echo "Listing generated build artefacts:"
          find build -name "*.vst3" -o -name "*.component" -o -name "*.app" || true

          for d in $(find build -type d -name "BRAUN_AS42.vst3"); do
            echo "Copying VST3 from $d"
            cp -R "$d" package/VST3/
            break
          done

          for d in $(find build -type d -name "BRAUN_AS42.component"); do
            echo "Copying AU from $d"
            cp -R "$d" package/AU/
            break
          done

          for d in $(find build -type d -name "BRAUN_AS42.app"); do
            echo "Copying Standalone from $d"
            cp -R "$d" package/Standalone/
            break
          done

          [ -f LICENSE ] && cp LICENSE package/ || true
          [ -f README.md ] && cp README.md package/ || true
          cd package
          zip -r ../BRAUN_AS42-v1.3.2-macOS-Universal.zip *
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRAUN_AS42-v1.3.2-macOS-Universal
          path: BRAUN_AS42-v1.3.2-macOS-Universal.zip

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: uploading release asset to v1.3.2..."
            if gh release upload v1.3.2 BRAUN_AS42-v1.3.2-macOS-Universal.zip --repo ${{ github.repository }} --clobber; then
              echo "Upload succeeded!"
              exit 0
            fi
            echo "Upload attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          exit 1
