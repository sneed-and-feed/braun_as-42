name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit & DSP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Web Audio & MIDI Tests
        run: npm test

      - name: Configure CMake for C++ Tests
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAS42_BUILD_TESTS=ON \
            -DAS42_USE_WEBVIEW=OFF

      - name: Build C++ Test Executables
        run: |
          cmake --build build --target dsp_tests challenger_stress_tests adversarial_challenge_suite --config Release -j$(nproc)

      - name: Execute C++ Test Suites
        run: |
          ./build/dsp_tests
          ./build/challenger_stress_tests
          ./build/adversarial_challenge_suite
